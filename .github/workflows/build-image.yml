name: "Build image"

# Builds the Flowko image natively on linux/amd64 and pushes it to GHCR.
# The build-time database arrangement is copied from upstream's release pipeline:
# .github/workflows/release-docker.yaml and .github/actions/docker-build-and-test/action.yml at 54343aa.

on:
  push:
    branches:
      - flowko
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Runs one at a time in push order, so flowko-latest always ends on the newest commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Build args. NEXT_PUBLIC_* values are compiled into the image; changing one needs a rebuild.
  NEXT_PUBLIC_WEBAPP_URL: "https://booking.flowko.si"
  NEXT_PUBLIC_WEBSITE_TERMS_URL: "https://flowko.si/terms"
  NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: "https://flowko.si/privacy"
  # Flowko: the "<host>/<username>/" prefix in the app; without it the value is derived from NEXT_PUBLIC_WEBAPP_URL
  NEXT_PUBLIC_WEBSITE_URL: "https://booking.flowko.si"
  NEXT_PUBLIC_APP_NAME: "Flowko"
  NEXT_PUBLIC_COMPANY_NAME: "David Vojvodić s.p., Flowko"
  NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS: "info@flowko.io"
  NEXT_PUBLIC_SENDGRID_SENDER_NAME: "Flowko"
  NEXT_PUBLIC_DISABLE_SIGNUP: "true"
  CALCOM_TELEMETRY_DISABLED: "1"
  MAX_OLD_SPACE_SIZE: "8192"
  # Throwaway build-time database (release-docker.yaml); matches the `database` service in docker-compose.yml
  POSTGRES_USER: "unicorn_user"
  POSTGRES_PASSWORD: "magical_password"
  POSTGRES_DB: "calendso"
  DATABASE_HOST: "database:5432"

jobs:
  build:
    name: "Build and push (linux/amd64)"
    # workflow_dispatch can target any branch that has this file; only flowko may push flowko-latest
    if: github.ref == 'refs/heads/flowko'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml's other services declare `env_file: .env`, so compose needs the file (upstream "Copy env").
      # Unlike upstream it is not appended to $GITHUB_ENV: .env.example would override the build args above.
      # The Dockerfile copies named paths only, so .env does not reach the image.
      - name: Start database
        run: |
          grep -o '^[^#]*' .env.example > .env
          docker compose up -d database

      - name: Show database logs and container status
        run: |
          echo "--- Container Status ---"
          docker compose ps database

          echo "--- Container Logs ---"
          docker compose logs database

      # BuildKit joins the database container's network, so DATABASE_URL below is reachable during the build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            network=container:database
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A blank or missing value would override the Dockerfile default and be compiled in as ""
      # (NEXT_PUBLIC_DISABLE_SIGNUP="" opens signup), so fail before building instead.
      - name: Check build args
        run: |
          for name in NEXT_PUBLIC_WEBAPP_URL NEXT_PUBLIC_WEBSITE_TERMS_URL NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL \
            NEXT_PUBLIC_WEBSITE_URL \
            NEXT_PUBLIC_APP_NAME NEXT_PUBLIC_COMPANY_NAME NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS \
            NEXT_PUBLIC_SENDGRID_SENDER_NAME NEXT_PUBLIC_DISABLE_SIGNUP CALCOM_TELEMETRY_DISABLED MAX_OLD_SPACE_SIZE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; set it in the env block of this workflow"
              exit 1
            fi
          done
          if [ "$NEXT_PUBLIC_DISABLE_SIGNUP" != "true" ] && [ "$NEXT_PUBLIC_DISABLE_SIGNUP" != "false" ]; then
            echo "::error::NEXT_PUBLIC_DISABLE_SIGNUP must be true or false"
            exit 1
          fi

      # NEXTAUTH_SECRET and CALENDSO_ENCRYPTION_KEY are not passed: like upstream, the build uses the
      # Dockerfile defaults and the real values are set only at runtime. DATABASE_DIRECT_URL is derived
      # from DATABASE_URL in the Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/davidvojvodic/flowko-booking:${{ github.sha }}
            ghcr.io/davidvojvodic/flowko-booking:flowko-latest
          labels: |
            org.opencontainers.image.source=https://github.com/davidvojvodic/flowko-booking
            org.opencontainers.image.revision=${{ github.sha }}
          # mode=min (the default) exports only the final stage's layers, so the builder stages are
          # never cached and rebuild on every run; this cache saves little beyond the runner base steps.
          cache-from: type=gha
          cache-to: type=gha,ignore-error=true
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ env.NEXT_PUBLIC_WEBAPP_URL }}
            NEXT_PUBLIC_WEBSITE_TERMS_URL=${{ env.NEXT_PUBLIC_WEBSITE_TERMS_URL }}
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=${{ env.NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL }}
            NEXT_PUBLIC_WEBSITE_URL=${{ env.NEXT_PUBLIC_WEBSITE_URL }}
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_COMPANY_NAME=${{ env.NEXT_PUBLIC_COMPANY_NAME }}
            NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=${{ env.NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS }}
            NEXT_PUBLIC_SENDGRID_SENDER_NAME=${{ env.NEXT_PUBLIC_SENDGRID_SENDER_NAME }}
            NEXT_PUBLIC_DISABLE_SIGNUP=${{ env.NEXT_PUBLIC_DISABLE_SIGNUP }}
            CALCOM_TELEMETRY_DISABLED=${{ env.CALCOM_TELEMETRY_DISABLED }}
            MAX_OLD_SPACE_SIZE=${{ env.MAX_OLD_SPACE_SIZE }}
            DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}
